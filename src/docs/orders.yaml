paths:
  /api/orders:
    post:
      summary: Create an order
      description: Creates a new order for the authenticated user
      tags:
        - Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderItemIds:
                  type: array
                  items:
                    type: string
                  example: ['item1', 'item2']
                shippingAddress1:
                  type: string
                  example: '123 Main St'
                shippingAddress2:
                  type: string
                  example: 'Apt 4B'
                country:
                  type: string
                  example: 'USA'
                city:
                  type: string
                  example: 'New York'
                phone:
                  type: string
                  example: '123-456-7890'
                zipCode:
                  type: string
                  example: '10001'
              required:
                - orderItemIds
                - shippingAddress1
                - city
                - country
                - phone
                - zipCode
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Order created successfully'
                  order:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'The following fields are required: ...'
        '404':
          description: No cart found for the user
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No cart found for this user!'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Error creating order'

    get:
      summary: Get all orders
      description: Retrieves all orders for the authenticated user
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: '#/components/schemas/Order'
                      orderItems:
                        type: array
                        items:
                          type: object
                          properties:
                            product:
                              $ref: '#/components/schemas/Product'
                            quantity:
                              type: integer
                              example: 2
        '204':
          description: No orders found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Error retrieving orders'

  /api/orders/get-orders:
    get:
      summary: Get all orders for the seller products
      description: Retrieves all orders where the seller is the authenticated user
      tags:
        - Orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Orders retrieved successfully'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  total:
                    type: integer
                    example: 100
        '204':
          description: No orders found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Error retrieving orders'

  /api/orders/{id}:
    delete:
      summary: Delete an order
      description: Deletes an order by ID
      tags:
        - Orders
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The order ID
      responses:
        '204':
          description: Order deleted successfully
        '404':
          description: No order found with the given ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'No order found with id: ...'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Error deleting order'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          example: 'order1'
        totalPrice:
          type: number
          example: 100.50
        country:
          type: string
          example: 'USA'
        city:
          type: string
          example: 'New York'
        phone:
          type: string
          example: '123-456-7890'
        userId:
          type: string
          example: 'user1'
        shippingAddress1:
          type: string
          example: '123 Main St'
        shippingAddress2:
          type: string
          example: 'Apt 4B'
        zipCode:
          type: string
          example: '10001'
        orderItemIds:
          type: array
          items:
            type: string
          example: ['item1', 'item2']
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - processing
            - shipped
            - delivered
            - cancelled
 /api/orders/{orderId}/process:
    put:
      summary: Process an order
      description: Updates the status of an order for the authenticated buyer
      tags: [Orders]
      security: 
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: The order ID
      responses:
        '200':
          description: Order processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Order processed successfully'
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Order not found'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

  /api/orders/{orderId}/change-status:
    put:
      summary: Change order status
      description: Updates the status of an order for the authenticated admin
      tags: [Orders]
      security: 
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: The order ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: 'delivered'
                expectedDeliveryDate:
                  type: string
                  format: date
                  example: '2024-12-31'
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Order status updated successfully'
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Order not found'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

  /api/orders/{orderId}/cancel:
    put:
      summary: Cancel an order
      description: Allows a buyer to cancel an order if it is in the "Paid" status
      tags: [Orders]
      security: 
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          description: The order ID
      responses:
        '200':
          description: Order cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Order cancelled successfully'
                  data:
                    $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Order not found'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Internal server error'

components:
  schemas:
    Order:
      type: object
      properties:
        _id:
          type: string
          example: '5f5f12345678'
        buyer:
          type: string
          example: 'buyer123'
        orderItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        shippingAddress1:
          type: string
          example: '123 Main St'
        shippingAddress2:
          type: string
          example: 'Apt 4B'
        city:
          type: string
          example: 'New York'
        country:
          type: string
          example: 'USA'
        phone:
          type: string
          example: '123-456-7890'
        zipCode:
          type: string
          example: '10001'
        status:
          type: string
          example: 'Pending'
        expectedDeliveryDate:
          type: string
          format: date
          example: '2024-12-31'
        totalPrice:
          type: number
          format: double
          example: 99.99
        paymentMethod:
          type: string
          example: 'Credit Card'
        transactionId:
          type: string
          example: 'trans_123456'
        createdAt:
          type: string
          format: date-time
          example: '2024-06-01T12:34:56Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-06-10T12:34:56Z'

    OrderItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          example: 2

    Product:
      type: object
      properties:
        _id:
          type: string
          example: 'product123'
        name:
          type: string
          example: 'Product Name'
        price:
          type: number
          format: double
          example: 49.99
        category:
          type: string
          example: 'Electronics'
        description:
          type: string
          example: 'Product description here'
        imageUrl:
          type: string
          example: 'https://example.com/product.jpg'
        seller:
          type: string
          example: 'seller123'

securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT