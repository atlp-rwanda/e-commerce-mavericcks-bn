tags:
  - name: Wishlist
    description: Operations related to buyer wishlist

paths:
  /api/wishlist/add-wishlist/{sizeId}:
    post:
      summary: Add a product to the wishlist
      security:
        - bearerAuth: []
      tags:
        - Wishlist
      parameters:
        - in: path
          name: sizeId
          required: true
          description: The ID of the size of the product to add to the wishlist
          schema:
            type: string
      responses:
        201:
          description: Product added to wishlist successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        400:
          description: Product already in wishlist or invalid size ID
          content:
            application/json:
              schema:
                $ref: '#/definitions/Error'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/Error'
  /api/wishlist/get-wishlist:
    get:
      summary: Get the user's wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      responses:
        200:
          description: Wishlist fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  wishlistItems:
                    type: array
                    items:
                      $ref: '#/definitions/WishlistItem'
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/Error'

  /api/wishlist:
    delete:
      summary: Clear the user's wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      responses:
        200:
          description: Wishlist cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/Error'

  /api/wishlist/item/{id}:
    delete:
      summary: Delete a product from the wishlist
      tags:
        - Wishlist
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          description: The ID of the wishlist item to delete
          required: true
          schema:
            type: string
      responses:
        200:
          description: Wishlist item deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
        500:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/definitions/Error'

definitions:
  WishlistItem:
    type: object
    properties:
      id:
        type: string
      userId:
        type: string
      productId:
        type: string
      images:
        type: array
        items:
          type: string
      name:
        type: string
      price:
        type: number

  Error:
    type: object
    properties:
      message:
        type: string